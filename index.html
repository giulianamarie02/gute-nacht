<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Wichtig für mobile Vollbild-Darstellung ohne Zoom/Scroll -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gute Nacht, Hase </title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     ANPASSBARE FARBEN
     Hier kannst du die komplette Farbwelt der Seite ändern.
  ============================================================ */
  :root{
    --sky-color: #120f45;       /* Nachthimmel-Hintergrund */
    --sky-color-2: #2a1768;     /* leichter Verlauf für mehr Tiefe */
    --star-color: #f5f0e6;      /* Farbe der normalen Pixel-Sterne */
    --cross-color: #ffe9c7;     /* Farbe der Kreuz-Sterne */
    --text-color: #f3ecff;      /* Haupttext */
    --text-color-soft: #cfc9ea; /* Untertitel-Text */
    --button-color: #fdf6e3;    /* Play-Button Grundfarbe */
    --button-color-active: #ffdca8; /* Play-Button beim Pausieren */
    --button-icon-color: #05054a; /* Farbe des Dreiecks/Pause-Icons */
    --footer-color: #7d7aa8;    /* kleiner Text unten */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden; /* kein Scrollen - alles passt auf den Screen */
    background: var(--sky-color);
  }

  body {
    font-family: 'Quicksand', sans-serif; /* leicht "pixeliger" Font-Charakter */
    color: var(--text-color);
    position: relative;
    width: 100%;
    /* dynamische Höhe für mobile Browser (iOS Safari Adressleiste etc.) */
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, var(--sky-color-2), var(--sky-color) 75%);
    user-select: none;
  }

  /* Sternenhimmel-Canvas liegt ganz im Hintergrund */
  #stars-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    z-index: 0;
  }

  #startScreen{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
    
    z-index:10;
    
    gap:20px;
  }

.start-star{

  font-size:90px;

  color:#ffdca8;

  cursor:pointer;

  animation: pulseStar 2s infinite ease-in-out;
}

.start-text{

  color:white;

  font-size:18px;

  opacity:0.9;
}

@keyframes pulseStar{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

  100%{
    transform:scale(1);
  }

}

  /* ============================================================
     Hauptinhalt - mittig, für Hochformat-Handys optimiert
  ============================================================ */
  .content {
    opacity: 0;
    transition:opacity 2s ease;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 4vh, 28px);
    padding: 24px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .title {
    font-size: clamp(22px, 6.5vw, 32px);
    line-height: 1.4;
    letter-spacing: 0.5px;
    color: var(--text-color);
    opacity: 0;
    transform: translateY(6px);
    /* sanftes, langsames Einblenden nach dem Laden */
    animation: fadeInSlow 2.4s ease-out 0.4s forwards;
    text-shadow: 0 0 2px rgba(0,0,0,0.4); /* dezent, kein Neon-Glow */
  }

  .subtitle {
    font-size: clamp(14px, 4vw, 17px);
    color: var(--text-color-soft);
    opacity: 0;
    transform: translateY(6px);
    animation: fadeInSlow 2.4s ease-out 1.6s forwards;
  }

  /* Play-Button: erscheint erst NACH dem Titel */
  .play-button {
    opacity: 0;
    pointer-events: none; /* erst klickbar, sobald sichtbar */
    animation: fadeInButton 2s ease-out 2.8s forwards;

    width: clamp(65px, 18vw, 85px);
    height: clamp(65px, 18vw, 85px);
    border-radius: 50%;
    background: var(--button-color);
    border: 3px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.05);
    transition: transform 0.15s ease, background 0.3s ease;
    margin-top: clamp(6px, 2vh, 14px);
  }

  .play-button:active {
    transform: scale(0.94); /* haptisches Gefühl beim Antippen */
  }

  .play-button.is-playing {
    background: var(--button-color-active);
  }

  /* Play-Dreieck (Pixel-Look: keine abgerundeten Ecken) */
  .icon-play {
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 18px solid var(--button-icon-color);
    margin-left: 6px; /* optische Zentrierung */
  }

  /* Pause-Icon: zwei kleine Balken */
  .icon-pause {
    display: none;
    gap: 7px;
  }
  .icon-pause span {
    width: 9px;
    height: 30px;
    background: var(--button-icon-color);
    display: block;
  }

  .play-button.is-playing .icon-play { display: none; }
  .play-button.is-playing .icon-pause { display: flex; }

  @keyframes fadeInSlow {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInButton {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); pointer-events: auto; }
  }

  /* ============================================================
     Footer-Text - sehr klein, unten am Bildschirmrand
  ============================================================ */
  .footer-note {
    position: absolute;
    bottom: max(10px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: var(--footer-color);
    z-index: 2;
    opacity: 0;
    animation: fadeInSlow 2.4s ease-out 3.2s forwards;
  }

  /* kleine Bildschirme (z.B. iPhone SE): Abstände etwas verkleinern */
  @media (max-height: 640px) {
    .content { gap: 10px; padding: 16px; }
    .play-button { width: 84px; height: 84px; margin-top: 4px; }
  }
</style>
</head>
<body>

  <!-- Canvas für den Pixel-Sternenhimmel -->
  <canvas id="stars-canvas"></canvas>

  <div id="startScreen">
    
    <div class="start-star">✦</div>
    
    <div class="start-text">
    Berühr den Stern.
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="title">Okay Hase, <br> Augen zu. </div>
    <div class="subtitle">Drück auf Play und hör mir zu.</div>

    <button class="play-button" id="playButton" aria-label="Abspielen">
      <div class="icon-play"></div>
      <div class="icon-pause"><span></span><span></span></div>
    </button>
  </div>

  <div class="footer-note">Für Nächte, in denen ich schon schlafe. 🌙</div>

  <!-- ============================================================
       AUDIO-ELEMENT
       Die Datei kann unten im Script ganz einfach über
       die Variable "audioFile" ausgetauscht werden.
  ============================================================ -->
  <audio id="bedtimeAudio" preload="auto"></audio>

  <script>
    /* ============================================================
   AUDIODATEI HIER EINFACH AUSTAUSCHEN
   Einfach den Dateinamen/Pfad anpassen - fertig.
============================================================ */

const audioFile = "gutenachtgeschichte/gutenachtgeschichte.mp3";

const audioEl = document.getElementById('bedtimeAudio');
audioEl.src = audioFile;

console.log("Audio-Datei:", audioEl.src);

audioEl.addEventListener("error", () => {
    console.error("Audiofehler:", audioEl.error);
});

const playButton = document.getElementById('playButton');

const startScreen = document.getElementById('startScreen');

const mainContent = document.getElementById('mainContent');

const ambientAudio = new Audio("gutenachtgeschichte/ambiente.mp3");

ambientAudio.loop = true;
ambientAudio.volume = 0.04;

playButton.addEventListener('click', () => {

    if (audioEl.paused) {

        audioEl.play()
            .then(() => {
                console.log("Audio gestartet!");
            })
            .catch(err => {
                console.error("Fehler beim Starten:", err);
            });

    } else {

        audioEl.pause();

    }

});

audioEl.addEventListener('play', () => {
    ambientAudio.volume = 0.015;
    playButton.classList.add('is-playing');
});

audioEl.addEventListener('pause', () => {
    ambientAudio.volume = 0.04;
    playButton.classList.remove('is-playing');
});

audioEl.addEventListener('ended', () => {
    ambientAudio.volume = 0.04;
    playButton.classList.remove('is-playing');
});

    /* ============================================================
       PIXEL-STERNENHIMMEL
       Ruhiges, minimalistisches Funkeln - kein Glow, kein Neon.
       Sterne = einzelne quadratische Pixel.
       Ein paar Sterne = kleine Pixel-Kreuze (5 Pixel in Kreuzform).
       Zusätzlich: seltene, sehr ruhige Sternschnuppen.
    ============================================================ */
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');

    const starColors = [
      "#ffdca8",
      "#ffb6d9",
      "#d991ff",
      "#a98dff",
      "#f6dca8"
    ];

    let width, height;
    let stars = [];
    let shootingStars = [];
    let clouds = [];

    // Pixelgröße der Sterne (für den Retro-Look)
    const PIXEL_SIZE = 4;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      generateStars();
    }

    function generateStars() {
      stars = [];
      // Sterndichte an Bildschirmfläche koppeln (mobil-freundlich)
      const area = width * height;
      const starCount = Math.floor(area / 2500);

      for (let i = 0; i < starCount; i++) {
        const isCross = Math.random() < 0.06; // ~6% der Sterne sind Kreuze
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          isCross: isCross,
          color: starColors[Math.floor(Math.random() * starColors.length)],
          size: isCross ? PIXEL_SIZE : (2 + Math.random() * 10),
          baseAlpha: 0.35 + Math.random() * 0.5,
          twinkleSpeed: 0.4 + Math.random() * 0.8, // langsam, ruhig
          twinklePhase: Math.random() * Math.PI * 2,
          sparkleChance: Math.random(),
        });
      }

      clouds = [];
      
      for (let i = 0; i < 12; i++) {
        clouds.push({
          x: Math.random() * width,
          y: Math.random() * height,
          scale: 1.5 + Math.random() * 2.5,
          alpha: 0.20 + Math.random() * 0.20
        });
      }
    }

    function drawPixelDot(x, y, size, color, alpha) {
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.fillRect(Math.round(x), Math.round(y), size, size);
    }

    function drawPixelCross(x, y, color, alpha) {
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      const s = PIXEL_SIZE * 1.5;
      // Kreuzform aus 5 kleinen Quadraten
      ctx.fillRect(Math.round(x), Math.round(y - s * 2), s, s);
      ctx.fillRect(Math.round(x), Math.round(y - s), s, s);
      ctx.fillRect(Math.round(x - s), Math.round(y), s, s);
      ctx.fillRect(Math.round(x), Math.round(y), s, s);
      ctx.fillRect(Math.round(x + s), Math.round(y), s, s);
      ctx.fillRect(Math.round(x), Math.round(y + s), s, s);
      ctx.fillRect(Math.round(x), Math.round(y + s * 2), s, s);
    }

    function drawCloud(cloud) {
      
      const x = cloud.x;
      const y = cloud.y;
      const s = cloud.scale;
      
      ctx.globalAlpha = cloud.alpha;
      ctx.fillStyle = "#7551b8";
      ctx.fillRect(x, y, 120 * s, 30 * s);
      ctx.fillRect(x + 25 * s, y - 25 * s, 90 * s, 30 * s)
      ctx.fillRect(x + 80 * s, y - 15 * s, 70 * s, 30 * s);
      ctx.fillRect(x + 140 * s, y, 50 * s, 25 * s);
      
      ctx.globalAlpha = 1;
    }

    // gelegentliche, sehr ruhige Sternschnuppe erzeugen
    function maybeSpawnShootingStar() {
      if (Math.random() < 0.0025 && shootingStars.length < 1) {
        const startX = Math.random() * width * 0.6;
        const startY = Math.random() * height * 0.3;
        shootingStars.push({
          x: startX,
          y: startY,
          length: 60 + Math.random() * 40,
          speed: 2.2 + Math.random() * 1.2, // ruhig, nicht hektisch
          angle: Math.PI / 5,
          life: 1
        });
      }
    }

    function drawShootingStars() {
      shootingStars.forEach(s => {
        const dx = Math.cos(s.angle);
        const dy = Math.sin(s.angle);
        const tailX = s.x - dx * s.length;
        const tailY = s.y - dy * s.length;

        const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
        grad.addColorStop(0, `rgba(245,240,230,${s.life})`);
        grad.addColorStop(1, `rgba(245,240,230,0)`);

        ctx.globalAlpha = 1;
        ctx.strokeStyle = grad;
        ctx.lineWidth = PIXEL_SIZE;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        s.x += dx * s.speed;
        s.y += dy * s.speed;
        s.life -= 0.012;
      });

      shootingStars = shootingStars.filter(s => s.life > 0 && s.y < height && s.x < width);
    }

    let t = 0;
    function animate() {
      ctx.clearRect(0, 0, width, height);

      ctx.globalAlpha = 1;
      
      ctx.fillStyle = "#f6dca8";
      
      ctx.beginPath();
      ctx.arc(100, 90, 35, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = "#1c1460";
      
      ctx.beginPath();
      ctx.arc(112, 85, 28, 0, Math.PI * 2);
      ctx.fill();

      clouds.forEach(cloud => {
        drawCloud(cloud);
      });

      stars.forEach(star => {
        // langsames, sanftes Funkeln über Sinus-Kurve
        const flicker = Math.sin(t * star.twinkleSpeed + star.twinklePhase);
        const alpha = star.baseAlpha + flicker * 0.55;
        const clampedAlpha = Math.max(0.1, Math.min(1, alpha));
        let starSize = star.size
        
        if (
          Math.sin(t * 2 + star.twinklePhase) > 0.995 &&star.sparkleChance > 0.7
        ) {
          starSize *= 2;
        }

        if (star.isCross) {
          drawPixelCross(star.x, star.y, star.color, clampedAlpha);
        } else {
         drawPixelDot(star.x, star.y, starSize, star.color, clampedAlpha);
        }
      });

      ctx.globalAlpha = 1;

      maybeSpawnShootingStar();
      drawShootingStars();

      clouds.forEach(cloud => {
        cloud.x += 0.03;
        
        if (cloud.x > width + 100){
          cloud.x = -120;
        }
      });

      t += 0.01; // niedrige Geschwindigkeit = ruhige Animation
      requestAnimationFrame(animate);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    // iOS Safari feuert manchmal orientationchange statt resize zuverlässig
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    document
     .querySelector('.start-star')
     .addEventListener('click', () => {
      
      ambientAudio.play();
      
      startScreen.style.opacity = "0";
      
      setTimeout(() => {

      startScreen.remove();

      mainContent.style.opacity = "1";

    }, 1000);

});

    animate();
  </script>

</body>
</html>
